name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  script:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        jlversion: [1.10.12, 1.11.9, 1.12.7, 1.13.0-rc4]
        os: [ubuntu-latest, macos-latest]
        sudo: ["", "sudo"]

    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Add symlink dir to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Test script
        env:
          VERSION: ${{ matrix.jlversion }}
          SUDO: ${{ matrix.sudo }}
        run: bash -e ci-test.sh
